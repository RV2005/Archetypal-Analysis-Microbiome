[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archetypal-analysis-pipeline"
version = "2.0.0"
description = "Config-driven, resumable archetypal analysis pipeline for microbiome datasets"
requires-python = ">=3.10"
dependencies = [
  "archetypes>=0.6",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "scikit-bio>=0.6",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "tqdm>=4.60",
  "umap-learn>=0.5",
  "biopython>=1.80",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]
notebook = ["jupyter>=1", "ipykernel>=6"]

[project.scripts]
aa-pipeline = "archetypal_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["archetypal_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
