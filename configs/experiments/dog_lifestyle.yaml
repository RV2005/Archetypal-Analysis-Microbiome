extends:
  - ../defaults.yaml
  - ../datasets/dog.yaml

experiment:
  name: dog_lifestyle
  description: Dog Lifestyle task migrated from dataset_configs.json

task:
  target: Lifestyle
  legend_type: discrete
  strip_numeric_prefix: true
  color_map:
    Pastoralist: "#1d6ea8"
    Agrarian: "#2ca02c"
    Urban: "#e377c2"
    Industrial: "#d62728"
    Foragers: "#70453c"

filter:
  enabled: true
  control: {}
  normalize: {
    "Lifestyle": ["1.Industrial", "2.Urban", "3.Pastoralist", "4.Agrarian", "5.Foragers"]
  }               
  continuous: false
  tolerance: 1.5

selection:
  mode: fixed
  fixed_k: 8

visualization:
  archetype_order: null # [Archetype 1, Archetype 6, Archetype 2, Archetype 3, Archetype 5, Archetype 8, Archetype 7, Archetype 4]
  archetype_colors:
    Archetype 1: "#e377c2"
    Archetype 2: "#982ead"
    Archetype 3: "#d62728"
    Archetype 4: "#fc6a2c"
    Archetype 5: "#1d6ea8"
    Archetype 6: "#11d07d"
    Archetype 7: "#70453c"
    Archetype 8: "#1D921D"
  taxa:
    num_taxa: 5

prediction:
  enabled: true

stability:
  enabled: true
