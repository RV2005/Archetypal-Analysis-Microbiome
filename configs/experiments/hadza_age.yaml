extends:
  - ../defaults.yaml
  - ../datasets/hadza.yaml

experiment:
  name: hadza_age
  description: Hadza continuous-age analysis with subject-grouped validation

task:
  target: age_months
  legend_type: continuous
  colorbar_title: Age in months
  # Retained automatically from prediction.group_column as well; keeping it explicit
  # makes the repeated-measures requirement visible in this experiment definition.
  required_metadata_columns: [SUBJECT_ID]

filter:
  exclude_target_values: [unknown]

evaluation:
  discretize_target: true
  buckets:
    - [0, 6]
    - [6, 12]
    - [12, 18]
    - [18, 24]
    - [24, 30]
    - [30, 36]
    - [36, 42]
    - [42, 48]
    - [48, 54]
    - [54, 73]

selection:
  mode: fixed
  fixed_k: 6

prediction:
  enabled: true
  # Repeated samples from the same person must remain in the same CV fold.
  group_column: SUBJECT_ID

stability:
  enabled: true
  sampling:
    # Group-disjoint subsampling also makes held-out projection subject-independent.
    group_column: SUBJECT_ID

visualization:
  archetype_order: null
  simplex:
    cmap: viridis
  multi_k_simplex:
    cmap: viridis
  stacked_bar:
    cmap: viridis
    discretize: true
    buckets:
      - [0, 6]
      - [6, 12]
      - [12, 18]
      - [18, 24]
      - [24, 30]
      - [30, 36]
      - [36, 42]
      - [42, 48]
      - [48, 54]
      - [54, 73]
  pcoa:
    cmap: viridis
  umap:
    cmap: viridis
  tsne:
    cmap: viridis
